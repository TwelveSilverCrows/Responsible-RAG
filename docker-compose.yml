# =============================================================================
# docker-compose.yml
# =============================================================================
# Dev:     docker compose up --build -d
# Prod:    docker compose --profile prod up --build -d
# Stop:    docker compose down
# Logs:    docker compose logs -f <service>
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Frontend (Vite + React via nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./resources:/app/resources:ro
      - ./vectordb:/app/vectordb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy with auto HTTPS (prod only)
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    container_name: rag-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# =============================================================================
# Volumes
# =============================================================================
volumes:
  vectordb:
  caddy_data:
  caddy_config: