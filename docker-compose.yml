# =============================================================================
# docker-compose.yml
# =============================================================================
# Dev:     docker compose -f docker-compose.yml up --build -d
# Prod:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Stop:    docker compose down
# Logs:    docker compose logs -f <service>
# =============================================================================

# ── Named volumes for services that don't use host bind mounts ──────────────
volumes:
  vectordb:
  caddy_data:
  caddy_config:

services:

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy (handles HTTPS via Let's Encrypt automatically)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: rag-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # MongoDB — Off-the-shelf, data persisted on the host
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8
    container_name: rag-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-rag}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ragpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-responsible_rag}
      # App user credentials (used by init.js to create a limited-privilege user)
      MONGO_APP_USER: ${MONGO_APP_USER:-rag}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-ragpassword}
    volumes:
      # Host-backed persistence: data survives container restarts & rebuilds
      - ./data/mongo:/data/db
      # Init script creates the app user + database on first run
      - ./data/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Frontend (Vite + React via nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Relative path — the frontend nginx proxies /api/v1/ to backend:8000.
        # Override only if you need an external backend URL.
        VITE_API_URL: /api/v1
    image: rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker frontend serves on port 3000 (dev) or behind Caddy (prod)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Point to the local Docker MongoDB service
      # authSource=admin uses the root admin user created automatically by
      # MONGO_INITDB_ROOT_USERNAME/PASSWORD (always exists).
      MONGO_URI: ${MONGO_URI:-mongodb://rag:ragpassword@mongo:27017/responsible_rag?authSource=admin}
    volumes:
      - ./resources:/app/resources:ro
      - ./vectordb:/app/vectordb
      - ./vectordb_profiles:/app/vectordb_profiles:ro
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Run as appuser (UID 1000). Make sure ./vectordb is owned by 1000:1000
    # on the host (run: sudo chown -R 1000:1000 ./vectordb).
    user: "1000:1000"