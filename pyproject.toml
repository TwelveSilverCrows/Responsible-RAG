[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Canadian Academic RAG Chatbot — audience-aware answers via FastAPI"
requires-python = ">=3.12"
dependencies = [
    # ── Core framework ────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    # ── LangChain ecosystem ───────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-classic>=0.1.0",          # EnsembleRetriever
    "langchain-chroma>=0.1.4",
    "langchain-experimental>=0.3.0",     # SemanticChunker
    "langchain-text-splitters>=0.3.0",
    # ── Embedding backends ────────────────────────────────────────────────
    "openvino>=2024.0.0",
    "optimum[openvino,nncf]>=1.20.0",
    # ── LLM provider ─────────────────────────────────────────────────────
    "openai>=1.30.0",                    # DeepSeek uses the OpenAI-compatible client
    # ── Vector store ──────────────────────────────────────────────────────
    "chromadb[cpu]>=0.5.0",
    # ── Retrieval ─────────────────────────────────────────────────────────
    "rank-bm25>=0.2.2",
    # ── Document loaders ──────────────────────────────────────────────────
    "pymupdf>=1.24.0",                   # PyMuPDFLoader for PDF ingestion
    # ── Configuration ─────────────────────────────────────────────────────
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.1",
    "langchain-deepseek>=1.0.1",
    # ── Observability ───────────────────────────────────────────────────
    "langsmith>=0.8.8",
    "langchain-nomic>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
